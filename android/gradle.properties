org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# The address the app opens: the hosted chatbot (python app.py behind HTTPS). No trailing slash.
# Release builds only talk HTTPS. Debug builds also allow http:// so the app can be tried against a
# computer on the same Wi-Fi, e.g.  gradlew installDebug -PFOB_SERVER_URL=http://192.168.1.20:8501
#
# The value below is a placeholder on purpose: the real address belongs to one installation (a private
# network name identifies its owner's computer), so it is not kept in the repository or in the zip.
# Give the real address in one of the standard Gradle ways, none of which is committed:
#   - on the command line:            gradlew assembleRelease -PFOB_SERVER_URL=https://your-server.example
#   - for every build on this PC:     a line FOB_SERVER_URL=https://... in %USERPROFILE%\.gradle\gradle.properties
#                                     (the user-level file overrides this one; Android Studio reads it too)
#   - from the environment:           ORG_GRADLE_PROJECT_FOB_SERVER_URL=https://...
# While the placeholder is in effect a release build stops with a message (app/build.gradle.kts) and a
# debug build shows "The server address is not set" instead of opening a page (MainActivity.kt).
FOB_SERVER_URL=https://CHANGE-ME.invalid
